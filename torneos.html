<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Torneos · GTC Sports</title>
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:'ArchivoB';font-weight:400;font-display:swap;src:url('fonts/archivo-400.woff2') format('woff2')}
@font-face{font-family:'ArchivoB';font-weight:600;font-display:swap;src:url('fonts/archivo-600.woff2') format('woff2')}
@font-face{font-family:'ArchivoB';font-weight:700;font-display:swap;src:url('fonts/archivo-700.woff2') format('woff2')}
@font-face{font-family:'InstrumentSerifB';font-weight:400;font-display:swap;src:url('fonts/instrumentserif-400.woff2') format('woff2')}
:root{
  --navy:#1B2050; --deep:#0C1030; --royal:#2E3A86; --gold:#C9A227; --laurel:#1E7A46; --rojo:#D64545;
  --bg:#F4F3EE; --card:#FFFFFF; --card-2:#FBFAF6; --line:#E2E0D7; --line-2:#EFEDE6;
  --ink:#14173A; --muted:#5B6079; --muted-2:#8A8FA6;
  --c-nodisp:#F2B8B5; --c-desc:#F6C99A; --c-llenas:#BFE3C4; --c-sin:#3A3D4A; --c-prev:#D9D9D9; --c-act:#B9B4F2; --c-ind:#FFF1A8;
  --fa:'ArchivoB',system-ui,-apple-system,sans-serif; --fs:'InstrumentSerifB',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 var(--fa)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--royal)}
p.j{text-align:justify}
.app{display:grid;grid-template-columns:200px 1fr;grid-template-rows:52px 1fr;height:100vh}
.top{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--navy);color:#fff}
.top .marca{font-family:var(--fs);font-size:22px;letter-spacing:.2px;white-space:nowrap}
.top .marca b{color:var(--gold);font-weight:400}
.top .tor{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.top .tor .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .estado{font-size:12px;opacity:.8;white-space:nowrap}
.top button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 11px}
.top button.oro{background:var(--gold);border-color:var(--gold);color:var(--deep);font-weight:600}
.nav{background:var(--card);border-right:1px solid var(--line);padding:10px 8px;overflow:auto}
.nav button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;color:var(--ink)}
.nav button:hover{background:var(--line-2)}
.nav button.on{background:var(--navy);color:#fff}
.nav .sep{height:1px;background:var(--line);margin:8px 4px}
.nav small{display:block;color:var(--muted-2);font-size:11px;padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.5px}
main{overflow:auto;padding:18px 22px 60px}
h1{font-family:var(--fs);font-weight:400;font-size:30px;margin:0 0 4px}
h2{font-size:16px;margin:18px 0 8px}
h3{font-size:14px;margin:14px 0 6px}
.sub{color:var(--muted);margin:0 0 14px}
.fila{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fila.fin{justify-content:flex-end}
.esp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-size:14px;color:var(--ink)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=search],input:not([type]),select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--royal);outline-offset:-1px}
label.ck{display:flex;gap:7px;align-items:center;font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px}
.btn:hover{border-color:var(--muted-2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.oro{background:var(--gold);border-color:var(--gold);color:var(--deep);font-weight:600}
.btn.peligro{color:var(--rojo);border-color:#efc4c4}
.btn.mini{padding:3px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
table.t{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
table.t th{position:sticky;top:0;background:var(--card-2);text-align:left;font-weight:600;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap}
table.t td{border-bottom:1px solid var(--line-2);padding:6px 8px;vertical-align:middle}
table.t tr:hover td{background:#FAF9F4}
table.t tr.sel td{background:#EEF0FA}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--line-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:#DDF1E3;color:var(--laurel)}
.chip.pend{background:#FBE3C8;color:#8A4B0B}
.chip.rojo{background:#F8DADA;color:#9B2323}
.chip.azul{background:#E1E6FB;color:var(--royal)}
.chip.oro{background:#F6EBC6;color:#7A5E06}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 12px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{border-color:var(--navy);color:var(--ink);font-weight:600}
.vacio{color:var(--muted);padding:26px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:var(--card-2)}
.aviso{background:#FFF7E0;border:1px solid #F0DCA0;border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:13px}
.error{background:#FDECEC;border:1px solid #F3C1C1;color:#8E1F1F;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px}
.ok-msg{background:#E6F4EA;border:1px solid #BFE1C9;color:#1D5F36;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:13px}
/* modal */
.velo{position:fixed;inset:0;background:rgba(12,16,48,.42);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow:auto}
.modal{background:var(--card);border-radius:14px;width:min(760px,100%);box-shadow:0 18px 50px rgba(12,16,48,.3);display:flex;flex-direction:column;max-height:92vh}
.modal.ancho{width:min(1100px,100%)}
.modal.chico{width:min(460px,100%)}
.modal header{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:17px}
.modal header button{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--muted)}
.modal .cuerpo{padding:16px 18px;overflow:auto}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:var(--card-2);border-radius:0 0 14px 14px}
.props{display:grid;grid-template-columns:180px 1fr;min-height:480px}
.props nav{border-right:1px solid var(--line);padding:8px}
.props nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px}
.props nav button.on{background:var(--navy);color:#fff}
.props section{padding:4px 18px 12px}
/* matrices de disponibilidad */
.matriz{border-collapse:collapse;font-size:11px}
.matriz th{font-weight:600;color:var(--muted);padding:3px 4px;white-space:nowrap}
.matriz th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:44px}
.matriz td{width:24px;height:22px;border:1px solid var(--line);cursor:pointer;text-align:center}
.matriz td.b{background:var(--c-nodisp)}
.matriz td.x{background:var(--c-sin);cursor:not-allowed}
/* planificación (F7) */
.plan td{width:46px;height:30px;font-size:10px}
.plan td.libre{background:#fff}
.plan td.sin-canchas{background:var(--c-sin);color:#fff}
.plan td.canchas-llenas{background:var(--c-llenas)}
.plan td.no-disponible{background:var(--c-nodisp)}
.plan td.descanso,.plan td.max-dia,.plan td.max-evento,.plan td.max-individuales{background:var(--c-desc)}
.plan td.antes-que-previo,.plan td.previo-sin-programar{background:var(--c-prev)}
.plan td.categoria-no-juega{background:#E9D7F5}
.plan td.actual{background:var(--c-act);font-weight:700}
.leyenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 10px}
.leyenda i{display:inline-block;width:14px;height:12px;border:1px solid var(--line);vertical-align:-2px;margin-right:4px}
/* cuadros */
.bracket{display:flex;gap:0;overflow:auto;padding:6px 0 20px}
.ronda{display:flex;flex-direction:column;min-width:210px}
.ronda h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;padding-left:6px}
.ronda .slots{display:flex;flex-direction:column;justify-content:space-around;flex:1}
.match{margin:4px 10px 4px 0;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;position:relative}
.match:hover{border-color:var(--royal)}
.match .lado{display:flex;gap:6px;align-items:center;padding:4px 8px;font-size:12.5px;min-height:24px}
.match .lado+.lado{border-top:1px solid var(--line-2)}
.match .lado.gana{font-weight:700}
.match .lado .sd{color:var(--muted-2);font-size:11px}
.match .lado .sc{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}
.match .meta{font-size:10.5px;color:var(--royal);padding:2px 8px 3px;border-top:1px dashed var(--line-2)}
.match.bye{opacity:.55;cursor:default}
.match.vivo{border-color:var(--gold);box-shadow:0 0 0 2px #F6EBC6}
.linea{font-size:12.5px;padding:3px 6px;border:1px dashed var(--line);border-radius:6px;margin:2px 10px 2px 0;cursor:pointer;background:var(--card-2)}
.linea:hover{border-color:var(--royal)}
table.rr{border-collapse:collapse;background:#fff;font-size:12.5px}
table.rr th,table.rr td{border:1px solid var(--line);padding:6px 8px;text-align:center;min-width:72px}
table.rr td.nom{text-align:left;min-width:180px}
table.rr td.x{background:var(--line-2)}
table.rr td.m{cursor:pointer;color:var(--royal)}
table.rr td.m:hover{background:#EEF0FA}
/* partidos */
.canchas{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.cancha{border:1px solid var(--line);border-radius:9px;background:#fff;padding:6px 10px;min-width:120px;font-size:12px}
.cancha b{display:block;font-size:13px}
.cancha.ocupada{border-color:var(--gold);background:#FFFBEE}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:2px;vertical-align:0}
.dot.na{background:var(--rojo)} .dot.av{background:var(--royal)} .dot.ck{background:var(--laurel)} .dot.cc{background:var(--gold)}
.sets input{width:46px;text-align:center}
.sets td{padding:3px}
.guardado{font-size:12px;opacity:.85}
.login{max-width:380px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px}
.login h1{margin-bottom:2px}
.lista-torneos .grupo{margin:0 0 18px}
.lista-torneos .grupo>h2{font-family:var(--fs);font-weight:400;font-size:22px;margin:0 0 8px}
@media print{.app>.top,.nav,.no-print{display:none!important}.app{display:block}main{padding:0}}
@media (max-width:820px){.app{grid-template-columns:1fr}.nav{display:flex;overflow:auto;padding:4px;border-right:0;border-bottom:1px solid var(--line)}.nav button{white-space:nowrap;width:auto}.nav small,.nav .sep{display:none}.props{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="raiz"></div>
<script type="module" src="tp/app.js"></script>
</body>
</html>
